[package]
name = "zanes-file-explorer"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
open = "5"
arboard = "3"
dirs = "5"
sysinfo = "0.30"
notify = { version = "8", default-features = false }
tauri-plugin-drag = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = "s"
strip = true
