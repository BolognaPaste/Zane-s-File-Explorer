<!doctype html><meta charset=utf-8><title>Zane's File Explorer</title>
<style>
/* "Deep space" theme. --ac is the accent from Settings; --ab, --ah and --glow are tints of it set in sApply(). --st1..3 are star tiles drawn by stars(). */
:root{--sp0:#03050c;--pn:rgba(9,14,30,.8);--chr:rgba(5,8,19,.66);--bg:#0a1022;--bg1:rgba(255,255,255,.03);--bg2:rgba(10,16,33,.97);--bg3:rgba(130,175,255,.1);
--ln:rgba(120,170,255,.17);--ln2:rgba(120,170,255,.09);--tx:#e4eeff;--mu:#8ea2c6;--fa:#5a6b8e;--hov:rgba(120,190,255,.07);--sel2:rgba(140,180,255,.1);--grid:rgba(120,170,255,.045);
--ac:#38d6ff;--act:var(--ac);--ab:rgba(56,214,255,.22);--ah:rgba(56,214,255,.1);--glow:rgba(56,214,255,.45);--er:#ff5d7a;
--neb1:rgba(110,80,255,.2);--neb2:rgba(255,70,170,.07);--sh:0 20px 50px rgba(0,0,0,.6);
--fd:'Bahnschrift','Segoe UI Variable Display','Segoe UI',sans-serif;--fc:'Bahnschrift SemiCondensed','Bahnschrift','Segoe UI',sans-serif;
--ff:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;--mono:'Cascadia Mono','Cascadia Code',Consolas,monospace;color-scheme:dark}
/* Bright hull: the same ship in daylight */
:root[data-theme=light]{--sp0:#dde6f2;--pn:rgba(255,255,255,.88);--chr:rgba(238,244,252,.86);--bg:#ffffff;--bg1:rgba(10,40,100,.035);--bg2:rgba(255,255,255,.98);--bg3:rgba(20,60,140,.08);
--ln:rgba(20,60,140,.17);--ln2:rgba(20,60,140,.09);--tx:#0c1630;--mu:#4b5d80;--fa:#8292ae;--hov:rgba(20,70,160,.05);--sel2:rgba(20,60,140,.08);--grid:rgba(20,60,140,.05);
--act:color-mix(in srgb,var(--ac) 52%,#06122a);--neb1:rgba(110,80,255,.08);--neb2:rgba(255,70,170,.04);--sh:0 18px 44px rgba(10,30,70,.18);color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--sp0);color:var(--tx);font:13px/1.4 var(--ff);height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
button,input,select{font:inherit;color:inherit}
::selection{background:var(--ab);color:var(--tx)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}svg.i .f{fill:currentColor;stroke:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ac) 28%,transparent);border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--ac) 55%,transparent)}::-webkit-scrollbar-corner,::-webkit-scrollbar-track{background:transparent}

/* The sky: nebula glow plus three drifting star layers. Each moves one tile (512px) per cycle in single-pixel steps, so it costs almost nothing. */
#sky,#sv,#gv{background:radial-gradient(ellipse 60% 50% at 12% 18%,var(--neb1),transparent 70%),radial-gradient(ellipse 55% 45% at 88% 85%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 70%),radial-gradient(ellipse 40% 30% at 65% 8%,var(--neb2),transparent 70%),var(--sp0)}
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#sky i{position:absolute;inset:-512px;background-size:512px 512px;will-change:transform}
#sky i:nth-child(1){background-image:var(--st1);animation:drift 900s steps(512) infinite}
#sky i:nth-child(2){background-image:var(--st2);animation:drift 520s steps(512) infinite}
#sky i:nth-child(3){background-image:var(--st3);animation:drift 300s steps(512) infinite,twinkle 9s steps(12) infinite alternate}
@keyframes drift{to{transform:translate3d(-512px,-256px,0)}}@keyframes twinkle{from{opacity:1}to{opacity:.45}}@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}@keyframes sweep{to{background-position:200% 0}}
#sv,#gv{background-image:var(--st2),var(--st3),radial-gradient(ellipse 60% 50% at 12% 18%,var(--neb1),transparent 70%),radial-gradient(ellipse 55% 45% at 88% 85%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 70%)}
.still #sky i,.still .empty:before,.still .pve:before{animation:none!important}
@media (prefers-reduced-motion:reduce){#sky i,.empty:before,.pve:before{animation:none!important}}
:root[data-theme=light] #sky i{display:none}:root[data-theme=light] #sv,:root[data-theme=light] #gv{background-image:none}
#top,#app{position:relative;z-index:1}

/* Corner brackets, the theme's signature. Any element with these gets four small L-shaped marks in --hc. */
.pane:before,#pv:before,#cm:before,#cs:before,dialog:before,.job:before,.sg:before,.pcc:before,#toast:before{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;--k:10px;
background:linear-gradient(var(--hc) 0 0) 0 0/var(--k) 1px,linear-gradient(var(--hc) 0 0) 0 0/1px var(--k),linear-gradient(var(--hc) 0 0) 100% 0/var(--k) 1px,linear-gradient(var(--hc) 0 0) 100% 0/1px var(--k),
linear-gradient(var(--hc) 0 0) 0 100%/var(--k) 1px,linear-gradient(var(--hc) 0 0) 0 100%/1px var(--k),linear-gradient(var(--hc) 0 0) 100% 100%/var(--k) 1px,linear-gradient(var(--hc) 0 0) 100% 100%/1px var(--k);background-repeat:no-repeat}
.pane,#pv,#cm,#cs,dialog,.job,.sg,.pcc,#toast{--hc:color-mix(in srgb,var(--act) 55%,transparent)}
.pane{--hc:color-mix(in srgb,var(--act) 25%,transparent)}.pane.act{--hc:var(--act)}

/* Command bar */
#top{display:flex;align-items:center;gap:2px;height:48px;padding:0 10px;background:linear-gradient(180deg,color-mix(in srgb,var(--chr) 100%,transparent),var(--chr));border-bottom:1px solid var(--ln);flex:none}
#top:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--ac) 25%,var(--ac) 75%,transparent);opacity:.6}
#top .logo{width:26px;height:26px;margin:0 6px 0 2px;color:var(--act);stroke-width:1.4;filter:drop-shadow(0 0 6px var(--glow))}
.ib,.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 9px;border:0;background:none;color:var(--mu);cursor:pointer;
clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.ib:hover,.tbtn:hover{background:var(--bg3);color:var(--tx);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--ac) 60%,transparent)}.ib:hover .i,.tbtn:hover .i{color:var(--act)}
.ib:active,.tbtn:active{background:var(--ab)}.ib:disabled,.tbtn:disabled{opacity:.3;cursor:default;background:none;box-shadow:none}.ib:disabled .i{color:inherit}
.ib.on{color:var(--act)}.tbtn span{font:500 12px var(--fc);text-transform:uppercase;letter-spacing:.1em;color:var(--tx)}.tbtn .dn{width:11px;height:11px;opacity:.6;margin-left:-2px}
#top .sep{width:1px;height:22px;margin:0 7px;background:linear-gradient(transparent,var(--ln),transparent)}#top .grow{flex:1}
.search{position:relative;display:flex;align-items:center;gap:8px;width:310px;height:32px;padding:0 10px;margin-right:6px;background:color-mix(in srgb,var(--sp0) 55%,transparent);border:1px solid var(--ln);border-radius:2px;color:var(--fa);cursor:text}
.search:before{content:'';position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--ac);opacity:.7}
.search:focus-within{border-color:color-mix(in srgb,var(--ac) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 40%,transparent),0 0 18px -4px var(--glow);color:var(--act)}
#qs{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:12.5px var(--fd);letter-spacing:.02em;user-select:text}#qs::placeholder{color:var(--fa)}
@media (max-width:1150px){.tbtn span{display:none}.search{width:200px}}

/* Sidebar */
#app{flex:1;display:flex;min-height:0}
#side{width:var(--sw,230px);flex:none;background:var(--chr);padding:6px 8px 16px;overflow:auto;font-family:var(--fd)}
#side h6{display:flex;align-items:center;gap:8px;font:600 10.5px var(--fc);text-transform:uppercase;letter-spacing:.18em;color:var(--fa);padding:16px 8px 7px}#side h6:first-child{padding-top:8px}
#side h6:before{content:'';width:5px;height:5px;flex:none;border:1px solid var(--act);transform:rotate(45deg)}#side h6:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--ln),transparent)}
.si{position:relative;display:flex;gap:9px;align-items:center;min-height:30px;padding:4px 8px;cursor:pointer;color:var(--tx);letter-spacing:.01em}
.si:hover{background:linear-gradient(90deg,var(--hov),transparent)}
.si.cur{background:linear-gradient(90deg,var(--ab),transparent 90%)}.si.cur:before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.si>.i{color:var(--act);opacity:.85}.si.cur>.i{opacity:1;filter:drop-shadow(0 0 4px var(--glow))}
.sl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.sdw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding:3px 0}
.du{display:block;height:4px;background:repeating-linear-gradient(90deg,var(--bg3) 0 5px,transparent 5px 7px);overflow:hidden}
.du i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ac) 0 5px,transparent 5px 7px);filter:drop-shadow(0 0 3px var(--glow))}.du i.hi{background:repeating-linear-gradient(90deg,var(--er) 0 5px,transparent 5px 7px)}
.cr{flex:none;display:flex;align-items:center;justify-content:center;width:16px;height:16px;margin:0 -4px 0 -6px;color:var(--fa);transition:transform .12s}
.cr .i{width:11px;height:11px}.cr:hover{color:var(--act)}.cr.o{transform:rotate(90deg)}.cr.e{visibility:hidden}
.gut{width:5px;flex:none;cursor:col-resize;position:relative;z-index:2}.gut:after{content:'';position:absolute;left:2px;top:0;bottom:0;width:1px;background:var(--ln)}
.gut:hover:after,.gut.on:after{background:var(--ac);box-shadow:0 0 10px var(--ac);width:2px}

/* Panes and tabs */
#mid{flex:1;display:flex;flex-direction:column;min-width:0}
#panes{flex:1;display:grid;grid-template-columns:1fr 5px 1fr;grid-template-rows:minmax(0,1fr);min-height:0}
.pane{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,var(--pn)}
.tabs{display:flex;align-items:flex-end;gap:3px;height:38px;padding:0 8px;background:var(--chr);overflow:hidden;flex:none;border-bottom:1px solid var(--ln2)}
.tab{position:relative;display:flex;align-items:center;gap:7px;height:30px;min-width:0;max-width:210px;padding:0 6px 0 14px;color:var(--mu);cursor:pointer;white-space:nowrap;font:13px var(--fd);letter-spacing:.02em;
clip-path:polygon(0 100%,0 9px,9px 0,100% 0,100% 100%)}
.tab:hover{background:var(--hov);color:var(--tx)}
.tab.on{color:var(--tx);background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 10%,transparent),transparent 80%),color-mix(in srgb,var(--pn) 100%,transparent);box-shadow:inset 0 1px 0 var(--ln)}
.act .tab.on{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 22%,transparent),transparent 85%),var(--pn);box-shadow:inset 0 2px 0 var(--ac)}
.tab>.i{color:var(--act)}.tl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tab b{display:flex;align-items:center;justify-content:center;width:20px;height:20px;flex:none;opacity:0}.tab b .i{width:11px;height:11px}
.tab:hover b,.tab.on b{opacity:.6}.tab b:hover{opacity:1;background:var(--bg3);color:var(--er)}
.tab[data-new]{width:30px;height:26px;padding:0;margin-bottom:2px;justify-content:center;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}.tab[data-new] .i{color:var(--mu)}
.navrow{display:flex;align-items:center;gap:6px;padding:7px 9px;flex:none}
.navb{display:flex;gap:1px}.navb .ib{width:30px;height:30px;padding:0}
.path{position:relative;flex:1;min-width:0;display:flex;align-items:center;height:32px;padding:0 6px;background:color-mix(in srgb,var(--sp0) 50%,transparent);border:1px solid var(--ln2);border-radius:2px;overflow:hidden;white-space:nowrap;color:var(--mu);cursor:text;font:12.5px var(--fd);letter-spacing:.02em}
.path:hover{border-color:var(--ln)}.path .pico{color:var(--act);margin:0 4px 0 2px}
.path span{flex:none;padding:3px 6px;cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.path span:last-of-type{flex:0 1 auto;min-width:0;color:var(--act);font-weight:600;text-shadow:0 0 12px var(--glow)}.path.fit span:last-of-type{flex:none}
.path .pel{flex:none;padding:3px 6px;font-style:normal;cursor:pointer}.path .pel:hover{background:var(--bg3);color:var(--tx)}.path .pel[hidden]{display:none}
.path [data-bs]{display:flex;align-items:center;justify-content:center;flex:none;width:15px;height:22px;color:var(--fa);cursor:pointer}.path [data-bs] .i{width:11px;height:11px}
.path span:hover,.path [data-bs]:hover{background:var(--bg3);color:var(--tx)}
.path:has(.adr){border-color:color-mix(in srgb,var(--ac) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 40%,transparent),0 0 18px -4px var(--glow)}
.adr{flex:1;min-width:0;height:100%;padding:0 4px;background:none;border:0;outline:0;color:var(--tx);font:12.5px var(--mono);user-select:text}

/* File list */
.cols,.row{display:grid;grid-template-columns:var(--gc,minmax(160px,1fr) 84px 130px 160px);align-items:center;padding:0 8px}
.cols{flex:none;height:28px;margin:0 6px;color:var(--fa);font:600 10.5px var(--fc);text-transform:uppercase;letter-spacing:.14em;border-bottom:1px solid var(--ln);overflow:hidden}
.cols div{position:relative;display:flex;align-items:center;gap:4px;height:100%;padding-right:10px;cursor:pointer;overflow:hidden;white-space:nowrap}.cols div:hover{color:var(--act)}
.cols .sa{width:11px;height:11px;color:var(--act)}.cols div:has(.hck){gap:8px}
.rz{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:col-resize}.rz:after{content:'';position:absolute;right:4px;top:8px;bottom:8px;width:1px;background:var(--ln)}.rz:hover:after,.rz.on:after{background:var(--ac);width:2px;right:3px;box-shadow:0 0 6px var(--ac)}
/* contain:strict makes the list, preview and status bar separate layout islands: a change in one never re-lays out the others */
.list{position:relative;flex:1;overflow:auto;padding:4px 6px 12px;contain:strict}
.row{position:relative;height:var(--rh,28px);width:max(100%,var(--tw,0px));background:var(--bk,linear-gradient(transparent 0 0)),var(--rb,linear-gradient(transparent 0 0))}
.row:hover{--rb:linear-gradient(90deg,var(--hov),transparent 80%)}
.row.sel{--rb:linear-gradient(var(--sel2) 0 0);box-shadow:inset 2px 0 0 var(--fa)}
.act .row.sel{--rb:linear-gradient(90deg,var(--ab),color-mix(in srgb,var(--ac) 7%,transparent) 75%,transparent);box-shadow:inset 2px 0 0 var(--ac)}
/* The focused row's corner brackets are background layers, so moving the focus only repaints and never re-lays out rows */
.act .row.foc{--bk:linear-gradient(var(--ac) 0 0) 0 0/6px 1px no-repeat,linear-gradient(var(--ac) 0 0) 0 0/1px 6px no-repeat,linear-gradient(var(--ac) 0 0) 100% 0/6px 1px no-repeat,linear-gradient(var(--ac) 0 0) 100% 0/1px 6px no-repeat,
linear-gradient(var(--ac) 0 0) 0 100%/6px 1px no-repeat,linear-gradient(var(--ac) 0 0) 0 100%/1px 6px no-repeat,linear-gradient(var(--ac) 0 0) 100% 100%/6px 1px no-repeat,linear-gradient(var(--ac) 0 0) 100% 100%/1px 6px no-repeat}.row.cut{opacity:.45}
.nm{display:flex;gap:9px;align-items:center;overflow:hidden;white-space:nowrap;min-width:0}
.tx{overflow:hidden;text-overflow:ellipsis;min-width:0}.act .row.sel .tx{color:#fff}:root[data-theme=light] .act .row.sel .tx{color:var(--tx)}.single .tx:hover{text-decoration:underline;cursor:pointer}
.sz,.dt{color:var(--mu);font:11.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sz{text-align:right;padding-right:16px}
.ty{color:var(--mu);font:12px var(--fd);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbp{color:var(--fa);font:11px var(--mono);flex-shrink:8;min-width:0;overflow:hidden;text-overflow:ellipsis}
.fi{width:17px;height:17px}.k-dir{color:var(--act)}.fi.k-dir path{fill:color-mix(in srgb,var(--ac) 22%,transparent)}
.k-pic{color:#4ef0a6}.k-vid{color:#ff6b9d}.k-aud{color:#ffad55}.k-doc{color:#74a9ff}.k-pdf{color:#ff6b6b}.k-code{color:#6ff0e4}.k-zip{color:#ffd166}.k-exe{color:#aab6d6}.k-note{color:#c49bff}.k-file{color:var(--mu)}
:root[data-theme=light] .k-pic{color:#159a63}:root[data-theme=light] .k-vid{color:#d43f72}:root[data-theme=light] .k-aud{color:#cf7414}:root[data-theme=light] .k-doc{color:#2f6fd8}:root[data-theme=light] .k-pdf{color:#d63a3a}:root[data-theme=light] .k-code{color:#0f9488}:root[data-theme=light] .k-zip{color:#b88a08}:root[data-theme=light] .k-exe{color:#5b6a8c}:root[data-theme=light] .k-note{color:#7c4ddb}
.ck,.hck{width:14px;height:14px;margin:0;accent-color:var(--ac);flex:none;cursor:pointer}.ck{opacity:0}.row:hover .ck,.row.sel .ck{opacity:1}
.gh{display:flex;align-items:center;gap:10px;margin:16px 2px 5px;padding:0 6px;color:var(--act);font:600 11px var(--fc);text-transform:uppercase;letter-spacing:.16em;cursor:pointer}.list>.gh:first-child,.rb:first-child>.gh:first-child{margin-top:6px}
/* Rows come in blocks of 200 that the browser doesn't lay out while they are off screen; thumbnails skip their contents the same way */
.rb{content-visibility:auto;contain-intrinsic-size:auto calc(200 * var(--rh,28px))}
.gh small{order:2;color:var(--fa);font:11px var(--mono);letter-spacing:0}.gh:after{content:'';order:1;flex:1;height:1px;background:linear-gradient(90deg,var(--ln),transparent)}
.empty{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:76px 24px;color:var(--mu);text-align:center;pointer-events:none}
.empty:before,.pve:before{content:'';position:absolute;left:50%;width:84px;height:84px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--ac) 45%,transparent);transform:translateX(-50%);animation:spin 40s linear infinite}
.empty:before{top:56px}.empty .i,.pve .i{width:44px;height:44px;stroke-width:1.1;color:var(--act);margin-bottom:18px;filter:drop-shadow(0 0 8px var(--glow))}
.empty b,.pve b{color:var(--tx);font:600 13px var(--fc);text-transform:uppercase;letter-spacing:.16em}.empty small,.pve small{font-size:12px;max-width:340px}
.grid{display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px}.grid .gh{flex-basis:100%}
.grid .row{width:var(--ts,96px);height:auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px;box-shadow:none;content-visibility:auto;contain-intrinsic-size:auto var(--ts,96px) calc(var(--ts,96px) + 46px)}
.grid .row.sel,.act .grid .row.sel{--rb:linear-gradient(var(--ab) 0 0);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 50%,transparent)}
.th{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--ac) 7%,transparent),transparent 70%)}
.th img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 0 0 1px var(--ln),0 6px 18px rgba(0,0,0,.4)}.th .fi{width:56%;height:56%;stroke-width:1.05}
.grid .tx{width:100%;text-align:center;font-size:12px;white-space:normal;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.grid .ck{position:absolute;top:6px;left:6px}.grid .sbp{display:none}.grid .ren{width:100%;flex:none}
.pst{flex:none;contain:strict;display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 14px;border-top:1px solid var(--ln2);background:color-mix(in srgb,var(--sp0) 30%,transparent);color:var(--mu);font:11.5px var(--fd);letter-spacing:.04em}
.pinfo{flex:1;display:flex;align-items:center;gap:12px;min-width:0;overflow:hidden;white-space:nowrap}.pinfo .fr{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--act)}
.pinfo>span+span:not(.fr):before{content:'';display:inline-block;width:4px;height:4px;margin:0 12px 2px 0;border:1px solid var(--fa);transform:rotate(45deg)}
.vsw{display:flex;gap:1px}.vsw .ib{width:26px;height:24px;min-width:0;padding:0}.vsw .ib.on{color:var(--act);background:var(--ab)}
.sx{color:var(--act);cursor:pointer}.sx:hover{text-decoration:underline}
