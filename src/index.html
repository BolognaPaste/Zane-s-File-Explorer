<!doctype html><meta charset=utf-8><title>Vault Opus</title>
<style>
:root{--bg:#1e1e1e;--bg2:#262626;--bg3:#2e2e2e;--ln:#363636;--tx:#dadada;--mu:#8a8a8a;--ac:#8b6cef;--ab:rgba(139,108,239,.2)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:13px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
#app{flex:1;display:flex;min-height:0}
#rib{width:42px;background:var(--bg2);border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:4px}
button{font:inherit}
#rib button,.tb button{background:none;border:0;color:var(--mu);border-radius:5px;cursor:pointer}
#rib button{width:30px;height:30px;font-size:16px}
#rib button:hover,.tb button:hover{background:var(--bg3);color:var(--tx)}
#rib .on{color:var(--ac)}
#side{width:190px;background:var(--bg2);border-right:1px solid var(--ln);padding:8px 6px;overflow:auto}
#side h6{font-weight:600;font-size:12px;color:var(--mu);padding:10px 8px 4px}
.si{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:5px;cursor:pointer}
.si svg{width:15px;height:15px;fill:none;stroke:var(--ac);stroke-width:1.2}.si:hover{background:var(--bg3)}
#mid{flex:1;display:flex;flex-direction:column;min-width:0}
.tb{display:flex;gap:2px;padding:4px 8px;border-bottom:1px solid var(--ln);background:var(--bg2)}
.tb button{padding:4px 12px}
#panes{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.pane{display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--ln)}.pane:first-child{border:0}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--ln);height:30px;align-items:flex-end;padding:0 4px;gap:2px;overflow:hidden}
.tab{padding:5px 8px 5px 12px;border-radius:6px 6px 0 0;color:var(--mu);cursor:pointer;white-space:nowrap;max-width:170px;overflow:hidden;display:flex;gap:6px}
.tab.on{background:var(--bg);color:var(--tx)}.act .tab.on{box-shadow:inset 0 2px var(--ac)}
.tab b{font-weight:400;opacity:.5}.tab b:hover{opacity:1}
.path{display:flex;align-items:center;gap:1px;padding:6px 8px;border-bottom:1px solid var(--ln);overflow:hidden;white-space:nowrap;color:var(--mu)}
.path span{padding:1px 5px;border-radius:4px;cursor:pointer}.path span:hover{background:var(--bg3);color:var(--tx)}.path span:last-child{color:var(--tx)}
.cols,.row{display:grid;grid-template-columns:1fr 84px 80px 140px;align-items:center;padding:0 10px}
.cols{height:var(--rh,24px);color:var(--mu);border-bottom:1px solid var(--ln);font-size:12px}.cols div{cursor:pointer}
.list{flex:1;overflow:auto}
.row{height:var(--rh,24px);border-left:2px solid transparent}.row:hover{background:#2a2a2a}
.row.sel{background:#333;border-color:#555}.act .row.sel{background:var(--ab);border-color:var(--ac)}
.act .row.foc{outline:1px solid var(--ac);outline-offset:-1px}
.nm{display:flex;gap:7px;align-items:center;overflow:hidden;white-space:nowrap}
.tx{overflow:hidden;text-overflow:ellipsis;min-width:0}.single .tx:hover{text-decoration:underline;cursor:pointer}
.nm svg{flex:none;width:15px;height:15px;fill:none;stroke:var(--mu);stroke-width:1.2}
.dir svg{stroke:var(--ac)}.md-f svg{stroke:#c4b5fd}
.sz,.dt,.ty{color:var(--mu);font-size:12px;white-space:nowrap}.sz{text-align:right;padding-right:14px}
.pst{display:flex;gap:16px;padding:3px 10px;border-top:1px solid var(--ln);color:var(--mu);font-size:12px}
#pv{width:320px;border-left:1px solid var(--ln);padding:18px;overflow:auto;user-select:text;line-height:1.55}
#pv h1{font-size:20px;font-weight:600;margin-bottom:4px;word-break:break-all}
.meta{color:var(--mu);font-size:12px;margin-bottom:14px}
#pv img{max-width:100%;border-radius:6px}
#pv pre{background:var(--bg2);padding:10px;border-radius:6px;font:12px 'Cascadia Code',Consolas,monospace;white-space:pre-wrap;word-break:break-all;margin:8px 0}
#pv code{background:var(--bg2);padding:1px 4px;border-radius:4px;font:12px Consolas,monospace}
.md h1,.md h2,.md h3,.md h4{margin:14px 0 6px;font-size:16px}.md h1{font-size:19px}.md li{margin-left:18px}
.wl{color:var(--ac)}.tag{background:var(--ab);color:#c4b5fd;padding:0 6px;border-radius:10px}.mu{color:var(--mu)}
dialog{margin:auto;background:var(--bg2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:16px;width:400px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog input{width:100%;margin:10px 0 0;padding:6px 8px;background:var(--bg);border:1px solid var(--ln);border-radius:5px;color:inherit;font:inherit}
dialog input:focus{outline:1px solid var(--ac)}
dialog menu{display:flex;flex-direction:row-reverse;gap:8px;padding:0;margin-top:14px}
dialog button{padding:5px 14px;border-radius:5px;border:1px solid var(--ln);background:var(--bg3);color:inherit;cursor:pointer}
dialog button[value=ok]{background:var(--ac);border-color:var(--ac);color:#fff}
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:#3a2a2a;border:1px solid #6b3b3b;padding:6px 14px;border-radius:6px;display:none}
#cm,#cs{position:fixed;display:none;z-index:9;min-width:240px;max-height:calc(100vh - 8px);overflow:auto;background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#cm .mi,#cs .mi{display:flex;justify-content:space-between;gap:28px;padding:5px 10px;border-radius:5px;cursor:pointer}
#cm .mi:hover,#cs .mi:hover{background:var(--ab)}#cm .dis{opacity:.4;pointer-events:none}
#cm kbd{font:inherit;font-size:12px;color:var(--mu)}#cm hr{border:0;border-top:1px solid var(--ln);margin:4px 2px}
#dm{white-space:pre-line;line-height:1.7}#toast.ok{background:#2a2540;border-color:var(--ac)}
.pc{flex:1;overflow:auto;padding:16px 18px}.pc h3{font-size:12px;font-weight:600;color:var(--mu);margin:6px 0 10px}
.pcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:20px}
.pcc{background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.pcc:hover{border-color:var(--ac);background:var(--ab)}.pcc svg{width:18px;height:18px;fill:none;stroke:var(--ac);stroke-width:1.2}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}.bar i.hi{background:#e05d6f}.pcc small{color:var(--mu)}
#gv{position:fixed;inset:0;z-index:8;background:var(--bg);display:none}#gc{width:100%;height:100%;display:block;cursor:grab}
#gx{position:absolute;top:12px;left:12px;background:var(--bg2);border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:5px 12px;cursor:pointer}
#gp{position:absolute;top:12px;right:12px;width:210px;background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
#gp label{display:flex;flex-direction:column;gap:4px;color:var(--mu);font-size:12px}#gp label:first-of-type{flex-direction:row;gap:8px;align-items:center}#gp input[type=range]{accent-color:var(--ac)}
#gt{position:absolute;bottom:12px;left:12px;color:var(--mu);font-size:12px}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:5px}

#sv{position:fixed;inset:0;z-index:8;background:var(--bg);display:none;overflow:auto;user-select:none}
#sv .wrap{max-width:720px;margin:0 auto;padding:28px 24px 64px}
#sv .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
#sv h2{font-size:22px;font-weight:600;margin-bottom:4px}#sv .sub{color:var(--mu)}
#sv h3{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:28px 0 8px}
.sg{background:var(--bg2);border:1px solid var(--ln);border-radius:10px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 16px}.sr+.sr{border-top:1px solid var(--ln)}
.sr b{font-weight:500;display:block}.sr small{color:var(--mu);font-size:12px;line-height:1.4}
.sw{position:relative;width:36px;height:20px;flex:none}.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:10px;background:#454545;transition:.15s}
.sw i:after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#cfcfcf;transition:.15s}
.sw input:checked+i{background:var(--ac)}.sw input:checked+i:after{left:18px;background:#fff}
.sw input:focus-visible+i{outline:2px solid var(--ac);outline-offset:2px}
#sv select{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:5px 8px;font:inherit;min-width:140px}
#sv input[type=color]{width:38px;height:26px;padding:0;border:1px solid var(--ln);border-radius:6px;background:none;cursor:pointer}
.sbtn{background:var(--bg2);border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:5px 12px;cursor:pointer}.sbtn:hover{border-color:var(--ac)}
</style>
<div id=app>
<div id=rib><button id=bs class=on title="Toggle sidebar">☰</button><button id=bp class=on title="Toggle preview">◧</button><button id=bg title="Settings (Ctrl+,)">⚙</button></div>
<div id=side></div>
<div id=mid>
<div class=tb><button data-a=back>Back</button><button data-a=fwd>Forward</button><button data-a=up>Up</button><button data-a=ref>Refresh</button><button data-a=pc>This PC</button><button data-a=graph>Graph view</button><button data-a=settings>Settings</button></div>
<div id=panes><div class=pane id=p0></div><div class=pane id=p1></div></div></div>
<div id=pv></div></div>
<dialog id=dlg><form method=dialog><div id=dm></div><input id=di><menu><button value=ok>OK</button><button value=cancel>Cancel</button></menu></form></dialog>
<div id=gv><canvas id=gc></canvas><button id=gx>Close</button><div id=gp><b>Graph view</b><label><input type=checkbox id=gf> Include files</label><label>Repel force<input type=range id=gr min=500 max=8000 value=2500></label><label>Link distance<input type=range id=gd min=30 max=160 value=60></label></div><div id=gt>Click a node to expand it. Double-click to open it. Scroll to zoom. Esc to close.</div></div>
<div id=sv></div><div id=cm></div><div id=cs></div><div id=toast></div>
<script>
const{invoke,convertFileSrc}=window.__TAURI__.core,C={list:['dir'],places:[],pcinfo:[],copy:['items','dest'],move:['items','dest'],trash:['items'],mkdir:['p'],rename:['a','b'],open:['p'],read:['p'],clip:['t'],show:['p'],openwith:['p'],apps:['ext'],openapp:['exe','p'],term:['d'],dup:['p'],newfile:['p'],link:['p','d'],zip:['items','out'],unzip:['z','d'],props:['p'],rm:['items'],rar:['args']},RN={move:'mv',trash:'recycle',open:'open_path',read:'read_text'};
const fsx=new Proxy({},{get:(_,n)=>(...a)=>invoke(RN[n]||n,Object.fromEntries(C[n].map((k,i)=>[k,a[i]]))).then(v=>({ok:true,v}),x=>({ok:false,e:String(x)}))});
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sepOf=p=>p.includes('\\')?'\\':'/',join=(a,b)=>a.replace(/[\\/]$/,'')+sepOf(a)+b;
const parent=p=>{const s=sepOf(p),q=p.replace(/[\\/]$/,'').split(s);if(q.length<2)return p;q.pop();const r=q.join(s);return /^[A-Za-z]:$/.test(r)?r+s:r||'/'};
const base=p=>p.replace(/[\\/]$/,'').split(/[\\/]/).pop()||p,ext=n=>n.includes('.')?n.split('.').pop().toLowerCase():'';
const fmt=b=>{const k=S.dec?1000:1024;return b<k?b+' B':b<k*k?(b/k).toFixed(1)+' KB':b<k**3?(b/k/k).toFixed(1)+' MB':(b/k**3).toFixed(2)+' GB'};
const when=t=>t?new Date(t).toLocaleString([],{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:!S.h24}):'';
const url=p=>convertFileSrc(p);
const drv=d=>/^[A-Za-z]:/.test(d.p)?`${d.name||'Local Disk'} (${d.p.slice(0,2)})`:d.p;
const FD='<svg viewBox="0 0 16 16"><path d="M1.5 3.5h4l1.5 1.5h7.5v7.5h-13z"/></svg>',FL='<svg viewBox="0 0 16 16"><path d="M3.5 1.5h6l3 3v10h-9zM9.5 1.5v3h3"/></svg>';
const IMG=/^(png|jpe?g|gif|webp|svg|bmp)$/,TXT=/^(md|txt|json|js|ts|css|html|py|log|csv|xml|ya?ml|ini|cfg|bat|ps1|sh|cs|java|c|cpp|h|rs|go|toml)$/;

const SD={start:'pc',single:false,dual:true,prev:true,hidden:false,ext:true,ff:true,sortk:'name',asc:true,confirmTrash:true,confirmPerm:true,density:'24',fs:'13',accent:'#8b6cef',h24:false,dec:false};
const S={...SD};try{const o=JSON.parse(localStorage.getItem('vo.settings')||'{}');for(const k in SD)if(typeof o[k]===typeof SD[k])S[k]=o[k]}catch{}
if(!/^#[0-9a-f]{6}$/i.test(S.accent))S.accent=SD.accent;
const sSave=()=>{try{localStorage.setItem('vo.settings',JSON.stringify(S))}catch{}};
const RISKY=/^(exe|bat|cmd|com|scr|ps1|lnk|msi|vbs|vbe|js|jse|wsf|hta|jar|reg|dll|cpl|pif)$/;
const dn=r=>S.ext||r.dir||RISKY.test(ext(r.name))?r.name:r.name.replace(/(.)\.[^.]+$/,'$1');
const SC=[
['General',[
['start','sel','Start location','Where new panes open',[['pc','This PC'],['Desktop','Desktop'],['Documents','Documents'],['Downloads','Downloads'],['Home','Home folder']]],
['single','tog','Single-click to open','Click a name to open it. Click anywhere else on the row to just select it'],
['dual','tog','Dual-pane layout','Show two panes side by side. Turn off for one pane'],
['prev','tog','Preview pane','Show a preview of the selected file on the right']]],
['Files and folders',[
['hidden','tog','Show hidden files','Include items with the hidden attribute and names that start with a dot'],
['ext','tog','Show file extensions','Show report instead of report.pdf. Programs and scripts (.exe, .bat, .lnk and similar) always keep their extension'],
['ff','tog','Folders first','Keep folders above files when sorting'],
['sortk','sel','Default sort','Applies to every tab',[['name','Name'],['size','Size'],['type','Type'],['mtime','Date modified']]],
['asc','tog','Ascending order','Turn off for Z to A, largest first, newest first']]],
['Safety',[
['confirmTrash','tog','Confirm before moving to the Recycle Bin','Ask first when you press Delete'],
['confirmPerm','tog','Confirm permanent delete','Recommended. Shift+Delete cannot be undone']]],
['Appearance',[
['density','sel','Row height','How tightly files are packed',[['20','Compact'],['24','Default'],['30','Comfortable']]],
['fs','sel','Text size','Size of text across the app',[['12','Small'],['13','Default'],['14','Large'],['16','Extra large']]],
['accent','col','Accent color','Used for selection, tabs and folders'],
['h24','tog','24-hour clock','Show 15:30 instead of 3:30 PM'],
['dec','tog','Decimal file sizes','1 KB = 1000 bytes (as on macOS) instead of 1024']]]];
function sApply(){const r=document.documentElement.style,n=parseInt(S.accent.slice(1),16);
r.setProperty('--ac',S.accent);r.setProperty('--ab',`rgba(${n>>16&255},${n>>8&255},${n&255},.2)`);r.setProperty('--rh',S.density+'px');
document.body.style.fontSize=S.fs+'px';document.body.classList.toggle('single',S.single);
$('#panes').style.gridTemplateColumns=S.dual?'1fr 1fr':'1fr';$('#p1').style.display=S.dual?'':'none';if(!S.dual&&A===1)setA(0);
showPrev=S.prev;$('#pv').hidden=!showPrev;$('#bp').classList.toggle('on',showPrev)}
function sRender(){$('#sv').innerHTML=`<div class=wrap><div class=top><div><h2>Settings</h2><div class=sub>Changes apply right away and are saved on this computer.</div></div><div><button class=sbtn id=sr>Reset to defaults</button> <button class=sbtn id=sc>Close</button></div></div>`+
SC.map(([t,rows])=>`<h3>${t}</h3><div class=sg>`+rows.map(([k,ty,l,d,o])=>`<div class=sr><div><b>${esc(l)}</b><small>${esc(d)}</small></div>`+
(ty==='tog'?`<label class=sw><input type=checkbox data-opt=${k}${S[k]?' checked':''}><i></i></label>`:ty==='col'?`<input type=color data-opt=${k} value="${S[k]}">`:`<select data-opt=${k}>${o.map(([v,n])=>`<option value="${v}"${S[k]===v?' selected':''}>${n}</option>`).join('')}</select>`)+`</div>`).join('')+`</div>`).join('')+`</div>`}
function sChanged(k){if(!/^#[0-9a-f]{6}$/i.test(S.accent))S.accent=SD.accent;sSave();sApply();
if(k==='sortk'||k==='asc'||k==='*')panes.forEach(P=>P.tabs.forEach(t=>{t.sk=S.sortk;t.asc=S.asc}));
if(k!=='accent'&&k!=='density'&&k!=='fs')panes.forEach((P,i)=>{const t0=P.t;P.tabs.forEach((_,j)=>{P.t=j;go(i,cur(i).p,false)});P.t=t0})}
function sOpen(){sRender();$('#sv').style.display='block'}
function sClose(){$('#sv').style.display='none'}
$('#sv').addEventListener('input',e=>{const k=e.target.dataset.opt;if(!k)return;S[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;sChanged(k)});
$('#sv').addEventListener('click',e=>{if(e.target.id==='sc')sClose();else if(e.target.id==='sr'){Object.assign(S,SD);sChanged('*');sRender()}});
const panes=[0,1].map(()=>({tabs:[],t:0}));let A=0,showPrev=true;const cur=i=>panes[i].tabs[panes[i].t];
function toast(m,ok){const t=$('#toast');t.textContent=m;t.className=ok?'ok':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
function ask(msg,val,dng){return new Promise(res=>{const d=$('#dlg'),i=$('#di');$('#dm').textContent=msg;i.style.display=val==null?'none':'';i.value=val??'';d.onclose=()=>res(d.returnValue==='ok'?(val==null?true:i.value.trim()||null):null);d.returnValue='';d.showModal();if(dng)d.querySelector('button[value=cancel]').focus();if(val!=null){i.focus();i.select()}})}
function crumbs(p){const pc='<span data-go="::pc">This PC</span>';if(p==='::pc')return pc;const s=sepOf(p),w=/^[A-Za-z]:/.test(p);let a='';return pc+'›'+p.split(s).filter(Boolean).map((x,i)=>{a=i?join(a,x):w?x+s:s+x;return`<span data-go="${esc(a)}">${esc(x)}</span>`}).join('›')}

el.innerHTML=`<div class=tabs>${P.tabs.map((t,k)=>`<div class="tab${k===P.t?' on':''}" data-k=${k}>${esc(t.p==='::pc'?'This PC':base(t.p))}<b data-x=${k}>×</b></div>`).join('')}<div class=tab data-new=1>+</div></div><div class=path>${crumbs(T.p)}</div><div class=cols>${[['name','Name'],['size','Size'],['type','Type'],['mtime','Modified']].map(([k,l])=>`<div data-s=${k}>${l}${T.sk===k?(T.asc?' ▴':' ▾'):''}</div>`).join('')}</div><div class=list>${T.rows.map((r,n)=>`<div class="row${r.dir?' dir':''}${ext(r.name)==='md'?' md-f':''}" data-n=${n}><span class=nm>${r.dir?FD:FL}<span class=tx>${esc(dn(r))}</span></span><span class=sz>${r.dir?'':fmt(r.size)}</span><span class=ty>${r.dir?'Folder':ext(r.name)||'File'}</span><span class=dt>${when(r.mtime)}</span></div>`).join('')}</div><div class=pst></div>`;if(T.p==='::pc'){el.querySelector('.cols').remove();el.querySelector('.list').outerHTML=`<div class=pc>${pcHtml(T.pc)}</div>`;el.querySelector('.pst').remove()}upd(i)}
function upd(i){const T=cur(i),el=$('#p'+i);if(T.p==='::pc'){if(i===A)prev();return}el.querySelectorAll('.row').forEach((r,n)=>{r.classList.toggle('sel',T.sel.has(n));r.classList.toggle('foc',T.f===n)});

el.querySelector('.pst').innerHTML=`<span>${T.rows.length} items</span>`+(T.sel.size?`<span>${T.sel.size} selected</span><span>${fmt(sz)}</span>`:'');
